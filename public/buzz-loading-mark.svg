<?xml version="1.0" ?>
<!-- minni fork: loading is the three chevrons brightening in sequence (brand
     rule). One cycle is 1.76s to match CYCLE_MS in src/app/launch.ts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>minni loading</title>
  <g fill="none" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M7 14 14 24 7 34" stroke="#8fbcac" opacity="0.25">
      <animate attributeName="opacity" begin="0s" dur="1.76s" repeatCount="indefinite"
        keyTimes="0;0.12;0.36;1" values="0.25;1;0.25;0.25"/>
    </path>
    <path d="M21 14 28 24 21 34" stroke="#6ba491" opacity="0.25">
      <animate attributeName="opacity" begin="0s" dur="1.76s" repeatCount="indefinite"
        keyTimes="0;0.24;0.36;0.6;1" values="0.25;0.25;1;0.25;0.25"/>
    </path>
    <path d="M35 14 42 24 35 34" stroke="#4e8a78" opacity="0.25">
      <animate attributeName="opacity" begin="0s" dur="1.76s" repeatCount="indefinite"
        keyTimes="0;0.48;0.6;0.84;1" values="0.25;0.25;1;0.25;0.25"/>
    </path>
  </g>
</svg>
